name: Validar servidor UHD

on:
  push:
    branches:
      - alteraçoes-gpt
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.slnx'
      - '.github/workflows/validar-servidor.yml'
  pull_request:
    branches:
      - alteraçoes-gpt
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.slnx'
      - '.github/workflows/validar-servidor.yml'
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore UHD.Servidor.csproj

      - name: Compilar servidor
        run: dotnet build UHD.Servidor.csproj --configuration Release --no-restore

      - name: Publicar servidor autónomo para teste
        run: dotnet publish UHD.Servidor.csproj --configuration Release --runtime win-x64 --self-contained true --output artefactos/Servidor-UHD

      - name: Disponibilizar servidor de teste
        uses: actions/upload-artifact@v4
        with:
          name: UHD-servidor-teste-${{ github.run_number }}
          path: artefactos/Servidor-UHD/
          if-no-files-found: error
          retention-days: 14
